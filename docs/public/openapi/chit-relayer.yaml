openapi: 3.0.3
info:
  title: Chit Relayer
  version: 0.1.0
  description: AGPL Deno relay for AgentSignedPaymentV2
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: wallet, nodes, and pins loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
        "503":
          description: not ready
  /relay:
    post:
      summary: Relay AgentSignedPaymentV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSignedPaymentV2"
      responses:
        "200":
          description: Relay status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayStatusResponse"
        "400":
          description: rejected
        "409":
          description: paused or idempotency conflict
        "503":
          description: infra error
  /relay/status:
    get:
      summary: Query relay status by session nonce
      parameters:
        - name: session_id_hex
          in: query
          required: true
          schema:
            type: string
        - name: pay_nonce
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Relay status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayStatusResponse"
        "404":
          description: unknown key
components:
  schemas:
    AgentSignedPaymentV2:
      type: object
      required:
        - version
        - session_id_hex
        - amount
        - payee_hex
        - nonce
        - funds_pk_hex
        - signature_hex
      properties:
        version:
          type: integer
          enum: [2]
        session_id_hex:
          type: string
        amount:
          type: integer
        payee_hex:
          type: string
        nonce:
          type: integer
        funds_pk_hex:
          type: string
        signature_hex:
          type: string
        scope_opening_hex:
          type: string
    RelayStatusResponse:
      type: object
      required:
        - session_id_hex
        - pay_nonce
        - tx_hash
        - state
      properties:
        session_id_hex:
          type: string
        pay_nonce:
          type: integer
        tx_hash:
          type: string
          nullable: true
        state:
          type: string
          enum: [submitted, included, reverted, unknown]
        block_height:
          type: integer
