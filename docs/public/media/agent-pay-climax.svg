<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Revoke mid-session</title>
  <desc id="desc">Three panes - Operator, Agent, Service - with Revoke stopping further settlement.</desc>
  <defs>
    <style>
      .bg { fill: #e8e4d9; }
      .pane { fill: #f3f1eb; stroke: rgba(28,36,48,0.18); stroke-width: 1.25; }
      .title { fill: #1c2430; font-family: Sora, system-ui, sans-serif; font-size: 15px; font-weight: 600; }
      .sub { fill: #4a5568; font-family: Sora, system-ui, sans-serif; font-size: 12px; }
      .tiny { fill: #4a5568; font-family: Sora, system-ui, sans-serif; font-size: 11px; }
      .btn { fill: #1c2430; }
      .btn-text { fill: #f3f1eb; font-family: Sora, system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .arrow { fill: none; stroke: #4a5568; stroke-width: 1.5; stroke-linecap: round; }
      .x { stroke: #8b3a3a; stroke-width: 2.25; stroke-linecap: round; }
      .fail { fill: #8b3a3a; font-family: Sora, system-ui, sans-serif; font-size: 11px; font-weight: 600; }
      .band { fill: #d5e0ea; }
      .band-text { fill: #1c2430; font-family: Literata, Georgia, serif; font-size: 13px; }
    </style>
  </defs>
  <rect class="bg" width="720" height="300" rx="0"/>
  <rect class="band" x="0" y="0" width="720" height="36"/>
  <text class="band-text" x="360" y="23" text-anchor="middle">Revoke mid-session</text>

  <!-- Operator -->
  <rect class="pane" x="16" y="52" width="220" height="220" rx="10"/>
  <text class="title" x="126" y="84" text-anchor="middle">Operator</text>
  <text class="sub" x="126" y="108" text-anchor="middle">Mandate / spend cap</text>
  <rect class="btn" x="66" y="168" width="120" height="36" rx="8"/>
  <text class="btn-text" x="126" y="191" text-anchor="middle">Revoke</text>
  <text class="tiny" x="126" y="236" text-anchor="middle">kill switch</text>

  <!-- Agent -->
  <rect class="pane" x="250" y="52" width="220" height="220" rx="10"/>
  <text class="title" x="360" y="84" text-anchor="middle">Agent</text>
  <text class="sub" x="360" y="108" text-anchor="middle">402 / pay / 200</text>
  <text class="tiny" x="360" y="148" text-anchor="middle">cap ticks down</text>
  <line class="x" x1="330" y1="178" x2="390" y2="238"/>
  <line class="x" x1="390" y1="178" x2="330" y2="238"/>
  <text class="fail" x="360" y="258" text-anchor="middle">next pay fails</text>

  <!-- Service -->
  <rect class="pane" x="484" y="52" width="220" height="220" rx="10"/>
  <text class="title" x="594" y="84" text-anchor="middle">Service</text>
  <text class="sub" x="594" y="108" text-anchor="middle">Metered API</text>
  <text class="tiny" x="594" y="148" text-anchor="middle">unlock on receipt</text>
  <rect x="534" y="178" width="120" height="36" rx="8" fill="none" stroke="#8b3a3a" stroke-width="1.75" stroke-dasharray="4 3"/>
  <text class="fail" x="594" y="201" text-anchor="middle">stays locked</text>
  <text class="tiny" x="594" y="248" text-anchor="middle">no further unlock</text>

  <!-- Flow hints -->
  <path class="arrow" d="M236 140 L250 140"/>
  <path class="arrow" d="M470 140 L484 140"/>
</svg>
